name: CI

on:
  push:
    branches:
      - main
      - hotfix/architecture-correctness-2026-09-24
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: governance_app/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev,postgres,trino]'

      - name: Compile
        run: python -m compileall -q app tests

      - name: Test
        run: pytest -q
