[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmetadata-governance-platform"
version = "0.7.0"
description = "OpenMetadata classification and PostgreSQL desired-state Ranger policy control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "starlette==0.47.3",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8,<2.12",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "fastmcp>=2.14.7,<2.15",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
trino = ["trino>=0.338,<0.339"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:openmetadata"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
no_implicit_optional = true
