version: 2

# Static Ranger tag-policy catalog.
#
# Ranger's tag service uses namespaced access types from component service-defs.
# For the local dev_trino service the Trino "select" permission is "trino:select",
# not plain "select".
#
# FLOW A:
#   edit this file -> restart backend -> policies reconcile into RANGER_TAG_SERVICE_NAME.
#
# FLOW B is independent:
#   OpenMetadata Confirmed tags -> Ranger tag store assignments.
#
# IMPORTANT:
#   Do not put ${entity_fqn}, ${field_path}, or ${field_name} here.
#   These policies exist before any asset is classified.

tag_policies:
  - tag: PII.Email
    policy_key: "tag-policy:PII.Email"
    name: "dg-tag-pii-email"
    description: Allow governed PII readers to select resources tagged PII.Email.
    groups: [pii_readers]
    accesses: [trino:select]

  - tag: PII.Phone
    policy_key: "tag-policy:PII.Phone"
    name: "dg-tag-pii-phone"
    description: Allow governed PII readers to select resources tagged PII.Phone.
    groups: [pii_readers]
    accesses: [trino:select]

  - tag: PII.NationalIdentifier
    policy_key: "tag-policy:PII.NationalIdentifier"
    name: "dg-tag-pii-national-identifier"
    description: Allow governed PII readers to select resources tagged PII.NationalIdentifier.
    groups: [pii_readers]
    accesses: [trino:select]

  - tag: PII.PaymentCard
    policy_key: "tag-policy:PII.PaymentCard"
    name: "dg-tag-pii-payment-card"
    description: Allow governed payment-data readers to select resources tagged PII.PaymentCard.
    groups: [payment_data_readers]
    accesses: [trino:select]
